<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Carl — desarrollador en formación</title>
  <desc id="desc">Banner oscuro con acentos violeta y turquesa, una ventana de código y el nombre Carl.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101426"/>
      <stop offset="0.55" stop-color="#17172c"/>
      <stop offset="1" stop-color="#0d1e28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4dd0c8"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c9d1d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="980" cy="40" r="310" fill="url(#orb)"/>
  <path d="M0 300C210 220 330 380 570 300s360-90 630-30" fill="none" stroke="url(#glow)" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 322C220 242 360 395 620 315s360-82 580-28" fill="none" stroke="#4dd0c8" stroke-opacity=".13" stroke-width="1.5"/>
  <g transform="translate(72 72)">
    <rect width="590" height="216" rx="18" fill="#0b0f19" fill-opacity=".88" stroke="#8b7cff" stroke-opacity=".45"/>
    <path d="M0 52H590" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="26" cy="27" r="6" fill="#ff6b6b"/>
    <circle cx="48" cy="27" r="6" fill="#ffd166"/>
    <circle cx="70" cy="27" r="6" fill="#4dd0c8"/>
    <text x="30" y="98" fill="#8b7cff" font-family="Consolas,monospace" font-size="17">&gt;</text>
    <text x="54" y="98" fill="#c9d1d9" font-family="Consolas,monospace" font-size="17">const</text>
    <text x="114" y="98" fill="#4dd0c8" font-family="Consolas,monospace" font-size="17">developer</text>
    <text x="220" y="98" fill="#c9d1d9" font-family="Consolas,monospace" font-size="17">= {</text>
    <text x="56" y="133" fill="#ffd166" font-family="Consolas,monospace" font-size="16">name:</text>
    <text x="118" y="133" fill="#a8e6cf" font-family="Consolas,monospace" font-size="16">'Carl'</text>
    <text x="56" y="165" fill="#ffd166" font-family="Consolas,monospace" font-size="16">focus:</text>
    <text x="118" y="165" fill="#a8e6cf" font-family="Consolas,monospace" font-size="16">'web + learning'</text>
    <text x="30" y="194" fill="#c9d1d9" font-family="Consolas,monospace" font-size="17">};</text>
    <rect x="248" y="179" width="10" height="19" rx="2" fill="#4dd0c8"/>
  </g>
  <g transform="translate(724 108)">
    <text x="0" y="0" fill="#c9d1d9" fill-opacity=".76" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">HOLA, SOY</text>
    <text x="-3" y="76" fill="#ffffff" font-family="Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="1">CARL</text>
    <rect x="1" y="101" width="76" height="5" rx="2.5" fill="url(#glow)"/>
    <text x="0" y="145" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="20">Desarrollador en formación</text>
    <text x="0" y="178" fill="#4dd0c8" font-family="Consolas,monospace" font-size="15">aprendiendo · creando · mejorando</text>
  </g>
  <g fill="#8b7cff" fill-opacity=".8">
    <circle cx="1090" cy="68" r="4"/><circle cx="1120" cy="104" r="2.5"/><circle cx="1068" cy="132" r="2"/>
    <circle cx="1162" cy="238" r="3"/><circle cx="1098" cy="276" r="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#c9d1d9" stroke-opacity=".09"/>
